# cnt —— 一个用 Rust 写的简易简体中文拼音输入法（IBus 引擎）
# 工作区根：所有 crate 依赖在此统一定义，各 crate 通过 `workspace = true` 引用。

[workspace]
resolver = "3"
members = [
    "crates/cnt-ibus",
    "crates/cnt-dict",
    "crates/cnt-dict-tools",
    "crates/cnt-lm",
    "crates/cnt-score",
    "crates/cnt-store",
    "crates/cnt-config",
    "crates/cnt-decode",
    "crates/cnt-input",
    "crates/cnt-engine",
    "crates/cnt-daemon",
    "crates/cnt-test-client",
    "crates/cnt-asr",
    "crates/cnt-asr-onnx",
    "crates/cnt-audio",
    "crates/cnt-voice",
    "crates/cnt-asr-tools",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "cnt: a simple Simplified Chinese pinyin input method (IBus engine) in Rust"
rust-version = "1.91"
readme = "README.md"
keywords = ["input-method", "ibus", "pinyin", "ime", "mmap"]
categories = ["text-editors"]

# 严格 clippy：pedantic + nursery + cargo 全部 deny（工作区统一生效）
# 组用 priority=-1 先应用，下面单条 allow 以默认 priority=0 覆盖组内成员
[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
# 本地私有项目，尚未发布到 crates.io 也无远端仓库，跳过发布元数据检查
cargo_common_metadata = "allow"
# zbus 宏依赖树同时引入 syn 2.x 与 3.x（传递依赖，非我们能控制）
multiple_crate_versions = "allow"

[workspace.dependencies]
# 第三方依赖：精确锁定到 crates.io 最新 stable（2026-08）
zbus = { version = "=5.18.0", default-features = false, features = ["tokio"] }
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "macros", "time", "signal", "sync"] }
futures-util = "=0.3.33"
memmap2 = "=0.9.11"

# 语音输入：ONNX 推理（ort 推荐方式 = 默认 features，download-binaries 拉预编译
# CPU 库；后续换 NPU 只需打开对应 execution provider feature，调用代码不变）
#
# 把默认的 tls-native 换成 tls-rustls：ort 在**构建期**用 HTTPS 下载
# onnxruntime 预编译库，tls-native 会拉 openssl-sys → 要求系统装 libssl-dev +
# openssl.pc。为了一次构建期的下载而给用户增加一个系统依赖不划算，
# rustls 是纯 Rust，开箱即编。（其余 feature 照搬默认值，api-27 含低版本 API。）
ort = { version = "=2.0.0-rc.13", default-features = false, features = [
    "std",
    "ndarray",
    "tracing",
    "download-binaries",
    "tls-rustls",
    "copy-dylibs",
    "api-27",
] }
# 麦克风采集（后端由 cpal 选：Linux 默认 ALSA，PipeWire 通过兼容层）
cpal = "=0.18.1"
# fbank 特征用的 FFT（fbank 自研，不引 C++ 特征库）
rustfft = "=6.4.1"
# wav 读写（离线转写 / 录音落盘 / 回归样本）
hound = "=3.5.1"

# 可观测性：log + fastrace（`--features "fastrace/enable"` 全局开启，默认关闭零开销）+ logforth
log = "=0.4.33"
fastrace = { version = "=0.7.19" }
logforth = { version = "=0.30.1", features = ["starter-log", "append-fastrace", "diagnostic-fastrace"] }

# 错误类型（显式，不用 anyhow）
thiserror = "=2.0.19"

# 时间库（约定用 jiff，不用 chrono）
jiff = "=0.2.35"
# 配置文件解析（TOML）
toml = "=1.1.4"

# 内部 crate（纯路径依赖，无需版本）
cnt-ibus = { path = "crates/cnt-ibus" }
cnt-dict = { path = "crates/cnt-dict" }
cnt-lm = { path = "crates/cnt-lm" }
cnt-score = { path = "crates/cnt-score" }
cnt-store = { path = "crates/cnt-store" }
cnt-config = { path = "crates/cnt-config" }
cnt-decode = { path = "crates/cnt-decode" }
cnt-input = { path = "crates/cnt-input" }
cnt-engine = { path = "crates/cnt-engine" }
cnt-asr = { path = "crates/cnt-asr" }
cnt-asr-onnx = { path = "crates/cnt-asr-onnx" }
cnt-audio = { path = "crates/cnt-audio" }
cnt-voice = { path = "crates/cnt-voice" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
